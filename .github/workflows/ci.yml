name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt 2>/dev/null || true
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check src/ api/

      - name: Format check with ruff
        run: ruff format --check src/ api/

      - name: Run tests
        run: |
          if [ -d "tests" ] && ls tests/test_*.py 1> /dev/null 2>&1; then
            pytest tests/ -v --tb=short
          elif [ -d "src" ] && ls src/test_*.py 1> /devdev/null 2>&1; then
            pytest src/ -v --tb=short
          else
            echo "No tests found, skipping"
          fi

      - name: Check imports resolve
        run: |
          python -c "from src.model import VehicleCNN, create_resnet_model; from src.data_loader import VehicleDataset; print('All imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vehicle-classifier .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 8000:8000 vehicle-classifier
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container